schema = 2
id = "koreader"
name = "KOReader"
description = "由 ReMagic 托管的 Paper Pro 与 Paper Pro Move 电子书阅读器"
version = "2026.3.0-remagic.11"
kind = "user"
package = "koreader-for-remagic"
supported_devices = ["paper_pro", "paper_pro_move"]
supported_os = []
required_remagic_api = 5
uninstall_policy = "keep_data"
exec = "/home/root/apps/koreader/current/payload/adapter/releases/__REMAGIC_ADAPTER_RELEASE__/bin/koreader-for-remagic"
working_dir = "/home/root/apps/koreader/current/payload/vendor/releases/v2026.03-56621d5ee66ad94f4f3e2e6d204e8c34be730343f915edc36bb076a043a2e468/koreader"
display = "qtfb"
resident = true
capabilities = [
  "display:qtfb-v1",
  "input:touch-v1",
  "lifecycle:v2",
  "network:outbound-v1",
]
supports_open_path = true
allowed_open_roots = [
  "/home/root/.local/share/koreader-for-remagic/library",
  "/home/root/.local/share/remarkable/xochitl",
]

[readiness]
mode = "first_frame"
timeout_ms = 60000

[shutdown]
graceful_timeout_ms = 3500
term_timeout_ms = 4500
kill_timeout_ms = 5500

[data_schema]
version = 2
migrator = "/home/root/apps/koreader/current/payload/adapter/releases/__REMAGIC_ADAPTER_RELEASE__/libexec/koreader-data-migrate"
backup_paths = [
  "/home/root/.local/share/remagic-koreader/data",
  "/home/root/.local/share/koreader-for-remagic/data",
]
backup_timeout_ms = 120000
migration_timeout_ms = 120000

[sync_provider]
schema = 1
exporter = "/home/root/apps/koreader/current/payload/adapter/releases/__REMAGIC_ADAPTER_RELEASE__/libexec/koreader-sync-state"
importer = "/home/root/apps/koreader/current/payload/adapter/releases/__REMAGIC_ADAPTER_RELEASE__/libexec/koreader-sync-state"
data_kinds = ["reading_progress", "bookmarks"]
timeout_ms = 30000

[runtime]
profile = "qtfb_compat"
background_execution = "freeze"
required_libraries = []

[runtime.directories]
home = "/home/root"
config_home = "/home/root/.config/koreader-for-remagic"
data_home = "/home/root/.local/share/koreader-for-remagic"
state_home = "/home/root/.local/state/koreader-for-remagic"
cache_home = "/home/root/.cache/koreader-for-remagic"
runtime_dir = "/run/remagic/apps/koreader"

[runtime.locale]
lang = "C.UTF-8"

[runtime.timezone]
name = "Asia/Shanghai"

[runtime.fonts]
directories = ["/home/root/apps/koreader/current/payload/adapter/releases/__REMAGIC_ADAPTER_RELEASE__/share/fonts"]

[runtime.certificates]
required = false

[runtime.network]
mode = "outbound"

[environment]
KOREADER_DIR = "/home/root/apps/koreader/current/payload/vendor/releases/v2026.03-56621d5ee66ad94f4f3e2e6d204e8c34be730343f915edc36bb076a043a2e468/koreader"
KOREADER_LIBEXEC_DIR = "/home/root/apps/koreader/current/payload/adapter/releases/__REMAGIC_ADAPTER_RELEASE__/libexec"
KO_HOME = "/home/root/.local/share/koreader-for-remagic/data"
KOREADER_DATA_DIR = "/home/root/.local/share/koreader-for-remagic/data"
KOREADER_SETTINGS = "/home/root/.local/share/koreader-for-remagic/data/settings.reader.lua"
KOREADER_BOOKS_DIR = "/home/root/.local/share/remarkable/xochitl"
KOREADER_SOURCE_LIBRARY_DIR = "/home/root/.local/share/remarkable/xochitl"
KOREADER_LIBRARY_STATE_ROOT = "/home/root/.local/share/koreader-for-remagic"
KOREADER_LIBRARY_DIR = "/home/root/.local/share/koreader-for-remagic/library"
KOREADER_LIBRARY_INDEX = "/home/root/.local/share/koreader-for-remagic/library.index"
KOREADER_COLLECTION_NAME = "全部书籍"
KOREADER_INSTALL_LOCK = "/home/root/.local/state/koreader-for-remagic/install.lock"
KOREADER_BACKUP_ROOT = "/home/root/.local/state/koreader-for-remagic/backups"
KOREADER_LEGACY_DATA_DIRS = "/home/root/.local/share/remagic-koreader/data:/home/root/.paperweight/services/koreader/koreader:/home/root/.config/koreader"
